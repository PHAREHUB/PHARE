name: Coverage

# gcov line coverage of the C++ sources, uploaded to codecov.io (config in codecov.yml)
#  test scope: default levels (1-10) without the nightly label

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft] # run when marked ready, cancel when back to draft
    # no coverage for PRs that only touch CI, docs or markdown; later patterns win
    paths:
      - '**'
      - '!.github/**'
      - '!res/ci/**'
      - '!doc/**'
      - '!**/*.md'
      - '!codecov.yml'
      - '.github/workflows/coverage.yml'
      - 'codecov.yml'
  push:
    branches: [master] # master reports are the base PRs are compared to
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    if: ${{ !github.event.pull_request.draft }} # draft PRs run only the gate
    runs-on: ubuntu-latest
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04
    timeout-minutes: 360

    steps:
    - name: Clone PHARE
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: 'recursive'
        persist-credentials: false

    - name: Configure CMake
      run: |
        set -ex
        . /.venv/bin/activate
        python3 -m pip install gcovr==8.6
        mkdir -p build && cd build
        cmake .. --fresh \
              -DSAMRAI_ROOT=/usr/local \
              -DCMAKE_BUILD_TYPE=Debug -Dcoverage=ON \
              -DPHARE_PYTEST_SIMULATORS=1 -Dphare_configurator=ON

    - name: Build
      working-directory: ${{github.workspace}}/build
      run: . /.venv/bin/activate; cmake --build . -j 2

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: . /.venv/bin/activate; ctest -j 2 -LE nightly --output-on-failure

    # a failing test still leaves coverage worth reporting
    - name: Coverage report
      if: ${{ !cancelled() }}
      working-directory: ${{github.workspace}}/build
      run: . /.venv/bin/activate; cmake --build . --target gcovr

    - name: Keep coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-cpp
        path: build/coverage/coverage.xml
        retention-days: 7

  # separate job on the bare runner: the container has no curl, which the
  #  Codecov action needs, and a failed upload can be re-run without the build
  upload:
    needs: cpp
    if: ${{ !cancelled() && needs.cpp.result != 'skipped' }}
    runs-on: ubuntu-latest

    steps:
    - name: Clone PHARE
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Get coverage report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: coverage-cpp
        path: build/coverage

    # no token on fork PRs: Codecov accepts tokenless uploads to their branches
    - name: Upload to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: build/coverage/coverage.xml
        disable_search: true
        flags: cpp-light
        name: gha-gcc
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
        verbose: true
