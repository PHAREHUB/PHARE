super: mpi

property:
  cxx_flags: >-
    -fPIC -std=c++20 -DPHARE_DIAG_DOUBLES=1 -DPHARE_FORCE_LOG_LINE=1
    -DPHARE_HAVE_THRUST=0 -DMKN_GPU_CPU=1 -fsanitize=address -fno-omit-frame-pointer

local:
  repo: /mkn/r
  mod-repo: /mkn/m
remote:
  repo: git@github.com:mkn/
  mod-repo: git@github.com:mkn-mod/
env: |
  ASAN_OPTIONS=detect_leaks=0
compiler:
  mask:
    g++:
      mpicxx
file:
  - type: cpp:cxx:cc
    archiver: ar -cr
    compiler: ccache mpicxx ${cxx_flags}
    linker: mpicxx ${cxx_flags} 
